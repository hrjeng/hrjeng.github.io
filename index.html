<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鄭浩然_磐石高級中學資料處理科</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet"  href="style.css">

</head>
<body>

    <div class="tab-container">
        <!-- 輪播區塊 -->
        <div class="carousel-container" id="autoCarousel">
            <div class="carousel-slide active"><img src="https://hrjeng.github.io/Taiwan.png" alt="Taiwan"></div>
            <div class="carousel-slide"><img src="https://picsum.photos/800/200?random=1" alt="picsum"></div>
            <div class="carousel-slide"><img src="https://hrjeng.github.io/Taipei.png" alt="Taipei"></div>
            <div class="carousel-slide"><img src="https://picsum.photos/800/200?random=2" alt="picsum"></div>
            <div class="carousel-slide"><img src="https://hrjeng.github.io/Kaohsiung.png" alt="Kaohsiung"></div>
            <div class="carousel-slide"><img src="https://picsum.photos/800/200?random=3" alt="picsum"></div>
            <div class="carousel-slide"><img src="https://hrjeng.github.io/Taichung.png" alt="Taichung"></div>
            <div class="carousel-slide"><img src="https://picsum.photos/800/200?random=4" alt="picsum"></div>
            <div class="carousel-slide"><img src="https://hrjeng.github.io/Hsinchu.png" alt="Hsinchu"></div>
            <div class="carousel-slide"><img src="https://picsum.photos/800/200?random=5" alt="picsum"></div>

            <button class="carousel-prev" onclick="prevSlide()">&#10094;</button>
            <button class="carousel-next" onclick="nextSlide()">&#10095;</button>

            <div class="carousel-dots">
                <span class="dot active" onclick="goToSlide(0)"></span>
                <span class="dot" onclick="goToSlide(1)"></span>
                <span class="dot" onclick="goToSlide(2)"></span>
                <span class="dot" onclick="goToSlide(3)"></span>
                <span class="dot" onclick="goToSlide(4)"></span>
                <span class="dot" onclick="goToSlide(5)"></span>
                <span class="dot" onclick="goToSlide(6)"></span>
                <span class="dot" onclick="goToSlide(7)"></span>
                <span class="dot" onclick="goToSlide(8)"></span>
                <span class="dot" onclick="goToSlide(9)"></span>
            </div>
        </div>

        <!-- 導覽區塊（包含桌面頁籤與行動下拉選單） -->
        <div class="tab-nav-wrapper">
            <!-- 手機端：下拉選單 -->
            <select class="tab-select-mobile" id="mobileTabSelect">
                <option value="tab-1.html">個人簡歷</option>
                <option value="tab-2.html">授課課程</option>
                <option value="tab-3.html">班級經營</option>
                <option value="tab-4.html">升學進路</option>
                <option value="tab-5.html">技藝競賽</option>
                <option value="tab-6.html">數位素養</option>
                <option value="tab-7.html">＠因材網</option>
            </select>

            <!-- 桌面端：頁籤選單 -->
            <div class="tab-header" role="tablist">
                <button class="tab-btn active" role="tab" aria-selected="true" data-file="tab-1.html">個人簡歷</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-file="tab-2.html">授課課程</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-file="tab-3.html">班級經營</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-file="tab-4.html">升學進路</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-file="tab-5.html">技藝競賽</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-file="tab-6.html">數位素養</button>
                <button class="tab-btn" role="tab" aria-selected="false" data-file="tab-7.html">＠因材網</button>
            </div>
        </div>

        <!-- 動態內容區域 -->
        <div class="tab-content-wrapper" id="main-content">
            <!-- 動態載入區域 -->
        </div>

        <div class="bottom">
            <p>HAO JAN CHENG @ Department of Data Processing, ST. Peter Senior High School, Hsinchu City</p>
            <p>2026</p>
        </div>
    </div>

    <script>
                function switchContent(selectId) {
                    const select = document.getElementById(selectId);
                    if (!select) return;
                    const targetId = select.value;
                    const parent = select.closest('.tab-panel');
                    const boxes = parent.querySelectorAll('.content-box');

                    boxes.forEach(box => box.style.display = 'none');
                    const targetBox = document.getElementById(targetId);
                    if (targetBox) targetBox.style.display = 'block';
                }

                async function loadTabContent(fileName) {
                    const wrapper = document.getElementById('main-content');
                    try {
                        const response = await fetch(fileName);
                        if (!response.ok) throw new Error('網絡響應不正常');
                        const html = await response.text();
                        wrapper.innerHTML = html;
                    } catch (error) {
                        wrapper.innerHTML = `<p style="color:red; text-align:center;">載入頁面失敗: ${error.message}</p>`;
                    }
                }

                // 統一切換處理（同步 Tab 樣式與 Select 選項）
                function changeTab(file) {
                    // 1. 載入內容
                    loadTabContent(file);

                    // 2. 更新桌面端 Tab 樣式
                    document.querySelectorAll('.tab-btn').forEach(btn => {
                        const isSelected = btn.getAttribute('data-file') === file;
                        btn.classList.toggle('active', isSelected);
                        btn.setAttribute('aria-selected', isSelected ? 'true' : 'false');
                    });

                    // 3. 更新行動端 Select 值
                    const mobileSelect = document.getElementById('mobileTabSelect');
                    if (mobileSelect && mobileSelect.value !== file) {
                        mobileSelect.value = file;
                    }
                }

                // 監聽桌面端 Tab 點擊
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        const file = this.getAttribute('data-file');
                        changeTab(file);
                    });
                });

                // 監聽手機端 Select 選擇變化
                const mobileSelect = document.getElementById('mobileTabSelect');
                mobileSelect.addEventListener('change', function () {
                    changeTab(this.value);
                });

                // 初次載入預設頁面
                loadTabContent('tab-1.html');

                /* 輪播邏輯 */
                let currentSlide = 0;
                const slides = document.querySelectorAll('.carousel-slide');
                const dots = document.querySelectorAll('.dot');
                let slideInterval = setInterval(nextSlide, 5000);

                function showSlide(index) {
                    slides.forEach((slide, i) => {
                        slide.classList.toggle('active', i === index);
                        dots[i].classList.toggle('active', i === index);
                    });
                    currentSlide = index;
                }

                function nextSlide() {
                    let index = (currentSlide + 1) % slides.length;
                    showSlide(index);
                }

                function prevSlide() {
                    let index = (currentSlide - 1 + slides.length) % slides.length;
                    showSlide(index);
                }

                function goToSlide(index) {
                    showSlide(index);
                    clearInterval(slideInterval);
                    slideInterval = setInterval(nextSlide, 5000);
                }
    </script>
</body>
</html>
